# agent-9/t55s: Actions-based Pages deployment (migrated from the flaky legacy builder).
# Sequence proven on Domain (t55q): legacy builder measurably flaps under fleet push floods
# (13/15 runs cancelled in one 9min window) and is the deprecated path. Artifact-based deploys
# are Jekyll-free and serialized by the concurrency group (latest push wins).
# guard: deploy job runs ONLY when repo Pages source is "workflow"; otherwise skips grey.
name: pages-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          RESP=$(curl -sS -m 15 -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${REPO}/pages")
          BT=$(echo "$RESP" | grep -o '"build_type": *"[^"]*"' | head -1 | sed 's/.*"\([^"]*\)"$/\1/')
          echo "measured build_type: ${BT:-<unreachable>}"
          if [ "$BT" = "workflow" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Pages source is still legacy — deploy-pages would be rejected. Skipping (grey)."
          fi

  deploy:
    needs: guard
    if: needs.guard.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 ACTIONS-LOCK 2026-11-14
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5 ACTIONS-LOCK 2026-11-14
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3 ACTIONS-LOCK 2026-11-14
        with:
          path: .
          include-hidden-files: true
      - id: dep
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4 ACTIONS-LOCK 2026-11-14